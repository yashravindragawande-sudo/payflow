# --- Server ---
server.port=8080

# --- H2 in-memory database ---
spring.datasource.url=jdbc:h2:mem:payflowdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- H2 web console (Task 2: open http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# ddl-auto=update lets Hibernate auto-create/update tables from the
# @Entity classes - no hand-written SQL needed (Task 2 requirement).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
